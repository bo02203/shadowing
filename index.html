<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>쉐도잉 녹음기</title>
<style>
:root{--bg:#f6f5f1;--tx:#222;--mu:#808080;--ac:#3b6fd4;--no:#d9473f}
@media(prefers-color-scheme:dark){:root{--bg:#17181b;--tx:#eee;--mu:#9a9a9a;--ac:#6b96ee;--no:#ef6b63}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#b{width:180px;height:180px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:72px;cursor:pointer;box-shadow:0 8px 28px rgba(59,111,212,.4);display:flex;align-items:center;justify-content:center}
#b.on{background:var(--no);font-size:56px;animation:p 1.4s ease-in-out infinite}
@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(217,71,63,.5)}50%{box-shadow:0 0 0 24px rgba(217,71,63,0)}}
#b:active{transform:scale(.95)}
#s{margin-top:26px;font-size:18px;min-height:28px}
#e{margin-top:10px;font-size:13px;color:var(--no);max-width:320px;word-break:break-word}
</style></head><body>
<button id="b" aria-label="녹음">🎙</button><div id="s">눌러서 녹음 시작</div><div id="e"></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},AC=null,R=null,PL=null,iv=0;
function ac(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;AC=new C()}return AC}
function stopPlay(){if(PL){try{PL.onended=null;PL.stop()}catch(e){}PL=null}}
function ui(on,msg){$("b").className=on?"on":"";$("b").textContent=on?"■":"🎙";$("s").textContent=msg}
function start(){stopPlay();$("e").textContent="";var c=ac();c.resume();ui(false,"마이크 준비 중…");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("e").textContent="이 브라우저에서는 마이크를 쓸 수 없어요 (https 주소로 열어야 해요)";ui(false,"눌러서 녹음 시작");return}
  var r=R={ch:[],t0:0};
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(st){
    if(R!==r){st.getTracks().forEach(function(t){t.stop()});return}
    r.st=st;r.src=c.createMediaStreamSource(st);r.pr=c.createScriptProcessor(4096,1,1);r.mu=c.createGain();r.mu.gain.value=0;
    r.pr.onaudioprocess=function(e){r.ch.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
    r.src.connect(r.pr);r.pr.connect(r.mu);r.mu.connect(c.destination);r.t0=Date.now();
    iv=setInterval(function(){var s=Math.floor((Date.now()-r.t0)/1000);ui(true,"녹음 중 "+Math.floor(s/60)+":"+("0"+s%60).slice(-2))},250);ui(true,"녹음 중 0:00")})
  .catch(function(e){R=null;ui(false,"눌러서 녹음 시작");$("e").textContent="마이크가 막혀 있어요. 주소창 왼쪽 자물쇠 → 권한 → 마이크 허용 후 새로고침해 주세요 ["+(e&&e.name||"")+"]"})}
function stop(){var r=R;R=null;clearInterval(iv);if(!r||!r.st){ui(false,"눌러서 녹음 시작");return}
  try{r.src.disconnect();r.pr.disconnect();r.mu.disconnect()}catch(e){}r.pr.onaudioprocess=null;r.st.getTracks().forEach(function(t){t.stop()});
  var n=0;r.ch.forEach(function(a){n+=a.length});var c=ac();if(n<c.sampleRate*.3){ui(false,"너무 짧아요. 다시 눌러 녹음하세요");return}
  var b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0),o=0;r.ch.forEach(function(a){d.set(a,o);o+=a.length});
  c.resume();var s=c.createBufferSource();s.buffer=b;s.connect(c.destination);PL=s;s.onended=function(){if(PL===s){PL=null;ui(false,"다시 누르면 새로 녹음해요")}};s.start();ui(false,"▶ 재생 중… (누르면 새로 녹음)")}
$("b").addEventListener("click",function(){if(R&&R.st)stop();else if(!R)start()});
})();
</script></body></html>
